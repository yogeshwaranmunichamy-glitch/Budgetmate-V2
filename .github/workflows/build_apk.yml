name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon -Dkotlin.compiler.execution.strategy=in-process -Dorg.gradle.workers.max=2 --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BudgetMate-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
